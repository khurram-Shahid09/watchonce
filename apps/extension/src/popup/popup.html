<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WatchOnce Recorder</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <img src="/icons/icon-32.png" alt="" width="20" height="20" />
      <strong>WatchOnce</strong>
      <span id="status-chip" class="chip">Idle</span>
    </header>

    <main>
      <section id="view-idle" hidden>
        <p class="muted">Do the task once while WatchOnce watches. Passwords are never captured.</p>
        <p class="site" id="site"></p>
        <button id="start" class="primary">● Start recording</button>
        <p class="hint">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd></p>
      </section>

      <section id="view-recording" hidden>
        <dl class="stats">
          <div><dt>Time</dt><dd id="elapsed">0:00</dd></div>
          <div><dt>Actions</dt><dd id="events">0</dd></div>
          <div><dt>Screens</dt><dd id="frames">0</dd></div>
        </dl>
        <div class="row">
          <button id="pause">Pause</button>
          <button id="stop" class="danger">■ Stop</button>
        </div>
      </section>

      <section id="view-stopped" hidden>
        <label for="description">What does this task do?</label>
        <textarea id="description" rows="3" maxlength="1000" placeholder="e.g. Create a vendor invoice from an email"></textarea>
        <p class="muted" id="summary"></p>
        <div id="upload-actions">
          <button id="upload" class="primary wide">Upload to workspace</button>
          <div class="row">
            <button id="download">Download</button>
            <button id="discard">Discard</button>
          </div>
        </div>
        <div id="upload-progress" class="progress" hidden>
          <progress id="upload-bar" max="1" value="0"></progress>
          <span id="upload-text">Uploading…</span>
        </div>
        <div id="upload-done" class="done" hidden>
          <p>✓ Uploaded. WatchOnce is turning it into a workflow.</p>
          <p class="muted">Recording <code id="upload-id"></code></p>
          <button id="new-recording" class="primary wide">New recording</button>
        </div>
      </section>

      <details id="connection" class="connection">
        <summary id="connection-summary">Not connected</summary>
        <form id="connect-form" hidden>
          <label for="api-url">WatchOnce address</label>
          <input id="api-url" type="url" required value="http://localhost:8000" />
          <label for="api-token">Access token</label>
          <input id="api-token" type="password" required placeholder="pat_…" autocomplete="off" />
          <p class="hint">Create one in WatchOnce under Settings → Access tokens.</p>
          <button id="connect" type="submit" class="primary wide">Connect</button>
        </form>
        <div id="connected" hidden>
          <p class="muted"><span id="connected-email"></span><br /><span id="connected-url"></span></p>
          <button id="disconnect">Disconnect</button>
        </div>
      </details>

      <ul id="warnings" class="warnings"></ul>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
