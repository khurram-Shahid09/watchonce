name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core (Django)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: watchonce
          POSTGRES_PASSWORD: watchonce
          POSTGRES_DB: watchonce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U watchonce" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://watchonce:watchonce@localhost:5432/watchonce
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy .
      - name: Spec models up to date
        run: uv run python scripts/gen_spec_models.py --check
      - name: Migrations up to date
        run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Tests
        run: uv run pytest

  js:
    name: web + spec (TypeScript)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Spec types up to date
        run: pnpm spec:gen && git diff --exit-code packages/spec/src/workflow.ts
      - name: Lint
        run: pnpm -r lint
      - name: Type-check
        run: pnpm -r typecheck
      - name: Unit tests
        run: pnpm -r test
      - name: Build
        run: pnpm -r build
      - name: Audit (production dependencies)
        run: pnpm audit --prod --audit-level high

  image:
    name: core image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f infra/core.Dockerfile -t watchonce-core:ci .
