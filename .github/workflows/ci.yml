name: CI

# Manual only (Actions tab -> CI -> Run workflow). Every check also runs locally; see README.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core (Django)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: watchonce
          POSTGRES_PASSWORD: watchonce
          POSTGRES_DB: watchonce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U watchonce" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://watchonce:watchonce@localhost:5432/watchonce
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Chromium for runner tests
        run: uv run playwright install --with-deps chromium
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy .
      - name: Spec models up to date
        run: uv run python scripts/gen_spec_models.py --check
      - name: Migrations up to date
        run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: OpenAPI schema valid (no warnings)
        run: uv run python manage.py spectacular --file /dev/null --validate --fail-on-warn --settings=config.settings.test
      - name: Tests
        run: uv run pytest
      # PYSEC-2026-4320 (certifi): the fix (2026.10.19) is younger than our 2-week rule; drop after 2026-11-02.
      - name: Audit (Python dependencies)
        run: uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt" && uvx pip-audit --strict -r "$RUNNER_TEMP/requirements.txt" --ignore-vuln PYSEC-2026-4320

  secrets:
    name: secrets scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 git /repo --no-banner --redact --exit-code 1

  js:
    name: web + spec (TypeScript)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Spec types up to date
        run: pnpm spec:gen && git diff --exit-code packages/spec/src/workflow.ts
      - name: Lint
        run: pnpm -r lint
      - name: Type-check
        run: pnpm -r typecheck
      - name: Unit tests
        run: pnpm -r test
      - name: Build
        run: pnpm -r build
      - name: Audit (production dependencies)
        run: pnpm audit --prod --audit-level high

  image:
    name: core image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f infra/core.Dockerfile -t watchonce-core:ci .
